# ============================================================
#  SmartMart JDBC connection settings
#  (edit db.url to match your SQL Server, keep the logins as they are)
# ============================================================

# Option 1 (recommended): TCP/IP enabled on port 1433 (see guide step 0)
# sendStringParametersAsUnicode=false : our columns are VARCHAR, so send parameters as VARCHAR
#   (otherwise SQL Server converts the column to NVARCHAR and may scan instead of using the index)
db.url=jdbc:sqlserver://localhost:1433;databaseName=SmartMart;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=false

# Option 2: SQL Server Express named instance + SQL Server Browser service running
#           (note the double backslash \\ in a .properties file)
# db.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=SmartMart;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=false

# ---- Application logins created by sql/07_security_roles_logins.sql ----
webshop.user=login_app_webshop
webshop.password=SmartMart@2026

pos.user=login_app_pos
pos.password=SmartMart@2026

warehouse.user=login_app_warehouse
warehouse.password=SmartMart@2026

pm.user=pm1
